name: Daily Wiki Quiz

on:
  schedule:
    # 매일 00:00 UTC (KST 09:00) — cron은 UTC 고정, 고부하 시간대엔 지연/스킵 가능
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 수동 실행용

jobs:
  generate-quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily quiz pipeline
        env:
          # src/ 내부 모듈이 `wiki_quiz.xxx` 절대 임포트를 쓰므로 src/를 PYTHONPATH에 추가해야
          # `python -m src.wiki_quiz.main` 실행 시 ModuleNotFoundError가 나지 않는다.
          PYTHONPATH: ${{ github.workspace }}/src
          OUTLINE_API_URL: ${{ vars.OUTLINE_API_URL }}
          OUTLINE_API_KEY: ${{ secrets.OUTLINE_API_KEY }}
          OUTLINE_ROOT_COLLECTION_ID: ${{ secrets.OUTLINE_ROOT_COLLECTION_ID }}
          OUTLINE_DOCUMENT_ID: ${{ secrets.OUTLINE_DOCUMENT_ID }}
          QUIZ_PROVIDER: ${{ vars.QUIZ_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QUIZ_MODEL: ${{ vars.QUIZ_MODEL }}
          DELIVERY_MODE: ${{ vars.DELIVERY_MODE }}
          OUTLINE_QUIZ_LOG_COLLECTION_ID: ${{ secrets.OUTLINE_QUIZ_LOG_COLLECTION_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m src.wiki_quiz.main
